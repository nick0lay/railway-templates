# Local harness that mirrors the Railway topology one-for-one.
#
#   Internet ─> caddy-ui  (public) ─> navigator (private) ─┐
#   Internet ─> caddy-api (public) ─> marqo     (private) <┘
#
# Only the two Caddy services publish ports here, exactly as only they get a
# Railway domain. Marqo and Navigator stay on the internal network, standing in
# for Railway's private networking. If you can reach them without going through
# Caddy, the template is wrong.
#
# Both app services build from the same Dockerfiles Railway builds, and Marqo
# uses the same single /data volume, so this exercises the real deployment path
# rather than an approximation of it.
#
#   cp .env.example .env
#   docker compose up -d --build
#   open http://localhost:8080   (UI)   http://localhost:8081/docs  (API + Swagger)

services:
  # Vector search engine: embedding inference + Vespa vector store in one image.
  marqo:
    build:
      context: ./marqo
      args:
        MARQO_IMAGE_TAG: ${MARQO_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Preloading loads the model during startup, so /health only goes green
      # once the service can actually index. Must match the model used at index
      # creation time.
      MARQO_MODELS_TO_PRELOAD: '["hf/e5-base-v2"]'
      MARQO_ENABLE_THROTTLING: "TRUE"
      LOG_LEVEL: WARN
    volumes:
      # One volume, matching Railway's one-per-service limit. It mounts at
      # Vespa's own state directory; the entrypoint nests the model cache inside
      # it at hf-cache/ (see marqo/railway-entrypoint.sh for why not the other
      # way around).
      - marqo-data:/opt/vespa/var
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8882/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      # First boot is the slow one: Vespa config server + content node converge
      # and the preload downloads ~420MB of model weights. Later boots hit the
      # volume and settle in well under a minute. Set generously — Railway
      # restart-loops a container that never passes its healthcheck.
      start_period: 300s

  # Admin UI. Talks to Marqo server-side over the internal network, so browser
  # traffic never needs a second set of credentials.
  navigator:
    build:
      context: ./navigator
      args:
        NAVIGATOR_IMAGE_TAG: ${NAVIGATOR_IMAGE_TAG:-v0.1.19}
      # The upstream base image publishes amd64 only; pinning the platform keeps
      # arm64 hosts (Apple Silicon) on emulation instead of failing the build.
      platforms:
        - linux/amd64
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MARQO_API_URL: http://marqo:8882
    depends_on:
      marqo:
        condition: service_healthy

  # Auth gateway for the UI. Same image and env contract the Railway template
  # uses, built from source so this test exercises the real thing.
  caddy-ui:
    build: https://github.com/iliab1/caddy-password-auth.git
    restart: unless-stopped
    environment:
      ORIGIN: http://navigator:9882
      BASIC_AUTH: ${UI_USERNAME:-admin}:${UI_PASSWORD:-changeme-ui}
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - navigator

  # Auth gateway for the raw Marqo API and its Swagger page.
  #
  # Deliberately a separate credential from the UI: this password grants
  # DELETE /indexes/{name} and DELETE /models. Handing someone read access to
  # the UI should not also hand them the ability to destroy every index.
  caddy-api:
    build: https://github.com/iliab1/caddy-password-auth.git
    restart: unless-stopped
    environment:
      ORIGIN: http://marqo:8882
      BASIC_AUTH: ${API_USERNAME:-admin}:${API_PASSWORD:-changeme-api}
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      marqo:
        condition: service_healthy

volumes:
  marqo-data:
